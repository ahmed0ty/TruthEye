version: 2
updates:
  - package-ecosystem: "nuget"
    directories:
      - "/TruthEye"
      - "/TruthEye.Tests"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/Front_End/truth-eye-web"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/TruthEye/AI-BERT-Service"
    schedule:
      interval: "monthly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
