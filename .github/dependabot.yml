version: 2
updates:
  - package-ecosystem: "nuget"
    directories:
      - "/TruthEye"
      - "/TruthEye.Tests"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Major upgrades change behaviour (mapping rules); review and test them by hand
      - dependency-name: "AutoMapper"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/Front_End/truth-eye-web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # typescript-eslint does not support TypeScript 7 yet; take major TypeScript upgrades manually
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/TruthEye/AI-BERT-Service"
    schedule:
      interval: "monthly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
