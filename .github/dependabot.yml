version: 2
updates:
  - package-ecosystem: "nuget"
    directories:
      - "/TruthEye"
      - "/TruthEye.Tests"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/Front_End/truth-eye-web"
    schedule:
      interval: "weekly"
    ignore:
      # typescript-eslint does not support TypeScript 7 yet; take major TypeScript upgrades manually
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/TruthEye/AI-BERT-Service"
    schedule:
      interval: "monthly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
